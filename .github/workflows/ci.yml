name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python dependencies and JDBC driver
        working-directory: python
        run: |
          pip install -r requirements-dev.txt
          mkdir -p lib
          curl -fsSL -o lib/tbjdbc17-7.2.6.jar https://repo1.maven.org/maven2/com/tmaxtibero/tbjdbc17/7.2.6/tbjdbc17-7.2.6.jar
          echo "2e8ad3e9bdb8bfb8c2cdc03692f504e3f43c8b7f7c546fc705ffb37785425de2  lib/tbjdbc17-7.2.6.jar" | sha256sum -c -
      - name: Python unit tests (includes spec/tools.json drift check)
        working-directory: python
        run: python -m pytest tests -q
      - name: Java unit tests and jar
        working-directory: java
        run: ./gradlew --no-daemon test shadowJar
      - name: Python / Java parity (no database)
        run: python -m pytest spec/conformance -q
