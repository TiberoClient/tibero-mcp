spring:
  application:
    name: tibero-mcp-server

  main:
    web-application-type: none
    banner-mode: off

  datasource:
    host: ${TIBERO_HOST:localhost}
    port: ${TIBERO_PORT:8629}
    database: ${TIBERO_DATABASE:tibero}
    username: ${TIBERO_USER:tibero}
    password: ${TIBERO_PASSWORD:}

  ai:
    mcp:
      server:
        name: tibero-mcp
        version: "0.1.0"
        type: SYNC
        stdio: true
        http:
          enabled: false
          protocol: STREAMABLE
