plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'tibero.mcp'
// Kept equal to the Python package version; spec/tools.json carries it to clients.
version = '0.2.0'

// Any JDK 17+ builds it; bytecode targets 17 so the jar runs on Java 17 and later.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:2.1.0')
    implementation 'io.modelcontextprotocol.sdk:mcp'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.14'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'ch.qos.logback:logback-classic:1.6.5'
    runtimeOnly 'com.tmaxtibero:tbjdbc17:7.2.6'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The shared MCP surface (tools, schemas, annotations) lives in ../spec and is
// generated from the Python server; both implementations are tested against it.
// (An include filter on a resources srcDir would also filter src/main/resources.)
processResources {
    from(rootProject.file('../spec')) {
        include 'tools.json'
    }
}
processTestResources {
    from(rootProject.file('../spec')) {
        include 'conformance/*.json'
    }
}

application {
    mainClass = 'tibero.mcp.TiberoMcpServer'
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()
}

tasks.named('test') {
    useJUnitPlatform()
}
